apiVersion: batch/v1
kind: Job
metadata:
  name: matmul-h100-mega-mps
  namespace: gpu-bench
  labels:
    owner: gpu-bench
    app: matmul-bench
    bench-tier: h100-mega-mps
spec:
  # 4 MPS clients per GPU * 8 GPUs = 32 concurrent pods on 1 x a3-megagpu-8g node
  completions: 32
  parallelism: 32
  completionMode: Indexed
  backoffLimit: 1
  template:
    metadata:
      labels:
        owner: gpu-bench
        app: matmul-bench
        bench-tier: h100-mega-mps
    spec:
      restartPolicy: Never
      nodeSelector:
        bench-pool: gpu-bench-h100-mega-mps
        cloud.google.com/gke-gpu-sharing-strategy: "mps"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
        - key: cloud.google.com/gke-spot
          operator: Exists
          effect: NoSchedule
        - key: cloud.google.com/gke-queued
          operator: Exists
          effect: NoSchedule
      containers:
        - name: matmul-bench
          image: pytorch/pytorch:2.8.0-cuda12.8-cudnn9-runtime
          command: ["bash", "-c", "nvidia-smi -L && python3 /bench/matmul_bench.py --tier h100-mega-mps"]
          envFrom:
            - configMapRef:
                name: bench-params
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: "5"
              memory: "48Gi"
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: bench-script
              mountPath: /bench
              readOnly: true
      volumes:
        - name: bench-script
          configMap:
            name: bench-script
